<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>Novaday · 圓潤幼貓星塵點亮預覽</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;color:#e8e9ff;background:#090a18;--mint:#bff4ee;--muted:#a3a4c1;--purple:#b9aeff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 20%,#202044,#090a18 70%)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:4px}header{max-width:1120px;margin:auto;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.08em}.brand svg{width:26px;color:var(--mint)}header a{color:var(--muted);font-size:12px;text-decoration:none}main{max-width:1000px;margin:12px auto 60px;padding:0 24px}.intro{text-align:center}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--mint)}h1{font-size:clamp(25px,4vw,34px);letter-spacing:.1em;font-weight:600;margin:10px 0}.intro p:last-child{color:var(--muted);font-size:13px;line-height:1.7}.toolbar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0}.segmented{display:flex;padding:4px;gap:4px;border:1px solid #ffffff15;border-radius:13px;background:#101126}.segmented button{padding:8px 16px;border:0;border-radius:9px;background:none;color:var(--muted);font-size:13px}.segmented button[aria-pressed="true"]{background:#b9aeff22;color:#ece9ff}.play{border:1px solid #bff4ee35;background:#bff4ee10;color:var(--mint);padding:9px 18px;border-radius:13px;font-size:13px;min-width:115px}.frame{max-width:850px;width:100%;margin:auto;border:1px solid #ffffff1b;border-radius:26px;overflow:hidden;background:radial-gradient(ellipse at 65% 50%,#191a39,#0a0b1c 75%);box-shadow:0 20px 80px #0005;transition:max-width .25s}.frame.phone{max-width:390px}.frame-top{display:flex;justify-content:space-between;padding:21px 24px 0;font-size:11px;color:var(--mint);letter-spacing:.06em}.figure svg{width:100%;display:block;aspect-ratio:380/300;overflow:visible}.caption{text-align:center;padding:0 18px 24px}.caption h2{font-size:21px;letter-spacing:.15em;margin:0 0 5px;font-weight:600}.latin{font-size:12px;letter-spacing:.13em;color:var(--muted);margin:0 0 13px}.dots{display:flex;justify-content:center;gap:9px;margin:16px 0}.dots i{width:6px;height:6px;border-radius:50%;background:#47465f}.dots i.on{background:var(--purple);box-shadow:0 0 8px #b9aeff80}.caption .message{color:var(--muted);font-size:12px;line-height:1.6;margin:0;min-height:20px}.progress{max-width:650px;margin:24px auto;padding:20px 22px;background:#101126aa;border:1px solid #ffffff12;border-radius:18px}.progress-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:17px}.progress-head output{color:var(--mint);font-variant-numeric:tabular-nums}input[type="range"]{width:100%;accent-color:var(--purple);cursor:pointer;margin:0 0 17px;min-height:22px}.stages{display:flex;justify-content:space-between;gap:5px}.stages button{border:1px solid #ffffff15;background:#ffffff04;border-radius:10px;color:var(--muted);height:39px;min-width:38px;flex:1;font-size:13px}.stages button[aria-pressed="true"]{border-color:#b9aeff90;color:#eae6ff;background:#b9aeff25}.end-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:10px}.gallery{max-width:900px;margin:30px auto}.gallery summary{color:var(--mint);font-size:13px;cursor:pointer;text-align:center;padding:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}.card{background:#0e0f24;border:1px solid #ffffff14;border-radius:16px;overflow:hidden;padding:5px 5px 13px;color:var(--muted);font-size:12px}.card[aria-pressed="true"]{border-color:#b9aeff80}.card svg{width:100%;display:block;aspect-ratio:380/300}.note{text-align:center;color:#8586a1;font-size:12px;line-height:1.8;margin:26px 0}.star-lit{filter:drop-shadow(0 0 2px #b9aeff)}.star-core{fill:#fff}.star-dim{fill:#9293b6;opacity:.58}.line-dim{stroke:#9999bb;stroke-width:.9;stroke-dasharray:2 5;opacity:.4}.line-lit{stroke:#b9aeff;stroke-width:1.9;stroke-linecap:round;filter:drop-shadow(0 0 2px #8a7cff)}.new-star{transform-box:fill-box;transform-origin:center;animation:appear .6s ease-out}.lit-pulse{animation:breathe 3.6s ease-in-out infinite}.thumb .lit-pulse{animation:none}@keyframes appear{0%{opacity:.3;transform:scale(.5)}65%{transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}@keyframes breathe{0%,100%{opacity:.83}50%{opacity:1}}@media(max-width:540px){header{padding:20px 18px}main{padding:0 12px}.frame{border-radius:23px}.progress{padding:17px 14px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.stages button{min-width:32px}.toolbar{gap:9px}.frame-top{padding:18px 20px 0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="app-effects.css"><link rel="stylesheet" href="app-launch.css">
<style>:root{--m0:#7E72C8;--m1:#5F8FEA;--m2:#5FD8CC;--m3:#FFE7A3;--m4:#FFC744;--flare:#FFB45C;--nebula:#8A7CFF;--text:#E8E9FF}.thumb *{animation:none!important}.sample-moods{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:14px 0 20px}.sample-moods span{display:flex;align-items:center;gap:5px}.sample-moods i{width:6px;height:6px;border-radius:50%;background:var(--c)}.play:disabled{opacity:.45;cursor:default}.complete{color:#ffe7a3;border-color:#ffe7a33b;background:#ffe7a308}.cstar{cursor:default}.preview-eye-note{text-align:center;font-size:12px;color:var(--muted);line-height:1.8}.figure .cfx{pointer-events:none}.caption .dots i.on{background:var(--c);box-shadow:0 0 8px var(--c)}.cfx-fade{animation-duration:1.4s}#gal.finishing .cfx-eye{display:none}
</style></head>
<body>
<header><div class="brand"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2 Q16 12 26 14 Q16 16 14 26 Q12 16 2 14 Q12 12 14 2Z" fill="currentColor"/></svg>Novaday</div><a href="../">造型比較 ↗</a></header>
<main id="app" class="app">
<div class="intro"><p class="eyebrow">LYNX · 圓潤幼貓</p><h1>一顆一顆，點亮天貓座</h1><p>每點亮一顆星，幼貓的毛色、臉部與星塵細節就更清晰。</p></div>
<div class="toolbar"><div class="segmented" role="group" aria-label="預覽尺寸"><button type="button" data-size="desktop" aria-pressed="true">桌面</button><button type="button" data-size="phone" aria-pressed="false">手機</button></div><button type="button" class="play" id="newBtn"><span>＋</span> 點亮下一顆</button><button type="button" class="play" id="play" aria-pressed="false">▶ 播放點亮</button><button type="button" class="play complete" id="complete">✧ 完成動畫</button></div>
<section class="frame" id="frame" aria-label="天貓座點亮預覽"><div class="frame-top"><span id="stateLabel">尚未點亮</span><span id="stateCount">0 / 6</span></div><div class="figure" id="figure"><svg id="gal" viewBox="0 0 380 300" role="img" aria-label="天貓座"></svg></div><div class="caption"><h2>天貓座</h2><p class="latin">Lynx</p><div class="dots" id="dots" aria-hidden="true"></div><p class="message" id="message" aria-live="polite">點亮第一顆星，喚醒小山貓。</p></div></section>
<section class="progress" aria-label="點亮進度控制"><div class="progress-head"><label for="progress">點亮進度</label><output id="progressCount" for="progress">0 / 6 顆星</output></div><input id="progress" type="range" min="0" max="6" step="1" value="0" aria-valuetext="尚未點亮，0 顆星"><div class="stages" role="group" aria-label="七個點亮階段"></div><div class="end-labels"><span>尚未點亮</span><span>全部點亮</span></div></section>
<div class="sample-moods" aria-label="心情色星示例"><span><i style="--c:var(--m0)"></i>很低落</span><span><i style="--c:var(--m1)"></i>有點累</span><span><i style="--c:var(--m2)"></i>還可以</span><span><i style="--c:var(--m3)"></i>不錯</span><span><i style="--c:var(--m4)"></i>很棒</span></div>
<details class="gallery"><summary>並排比較七個點亮階段</summary><div class="cards" id="cards"></div></details>
<p class="note">圓潤幼貓 · 星塵點亮預覽<br>正式 app 尚未套用。</p>
</main>
<script>const $=id=>document.getElementById(id);const sleep=ms=>new Promise(r=>setTimeout(r,ms));</script>
<script src="app-engine.js"></script><script src="app-launch.js"></script>
<script>
const frame=$('frame'),gal=$('gal'),slider=$('progress'),play=$('play'),nextButton=$('newBtn');
const sampleMoods=[2,3,1,4,2,3];const samples=sampleMoods.map((m,i)=>({id:'preview-'+i,mood:m,date:'心情示例',title:MOODS[m].n}));
let current=0,playing=false,busy=false,token=0,finishTimer=null,revealId=0;
const finalArt=(w=380,h=300)=>`<image class="final-art" href="../lynx-round.webp" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet"/>`;
const revealRandom=seedRng('round-kitten-content');
const revealDust=Array.from({length:360},()=>({x:revealRandom()*380,y:revealRandom()*300,r:7+revealRandom()*13,rank:revealRandom()}));
const revealAlpha=(n,rank)=>Math.max(0,Math.min(1,(n/6-rank)/.2+.5));
function growingOpacity(a,b){return a===b||reduce?'':`<animate attributeName="opacity" from="${a}" to="${b}" dur=".8s" fill="freeze"/>`}
function progressiveArt(n,w=380,h=300,from=n){
  if(n===0)return '';
  const id='round-content-'+(++revealId),base=.025+.24*n/6,previous=.025+.24*from/6;
  return `<defs><filter id="${id}-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter><mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="380" height="300" style="mask-type:alpha"><rect width="380" height="300" fill="white" opacity="${base}">${growingOpacity(previous,base)}</rect><g filter="url(#${id}-soft)">${revealDust.map(d=>{const a=revealAlpha(from,d.rank),b=revealAlpha(n,d.rank);return `<circle cx="${d.x}" cy="${d.y}" r="${d.r}" fill="white" opacity="${b}">${growingOpacity(a,b)}</circle>`}).join('')}</g></mask></defs><g class="progress-art" data-revealed="${n}" transform="scale(${w/380} ${h/300})" mask="url(#${id})"><image href="lynx-round-art.webp" width="380" height="300" preserveAspectRatio="xMidYMid meet"/></g>`
}
function progressScene(n,w=380,h=300,pad=46,from=n,sc=1.25,artN=n){
  const figure=artN===0?conFig('Lyn',w,h,conProj('Lyn',w,h,pad),0):'';
  return figure+progressiveArt(artN,w,h,from)+conSVG('Lyn',w,h,pad,n,samples,{bg:70,next:true,sc,fig:false})
}
function settleFinal(){clearTimeout(finishTimer);finishTimer=null;gal.innerHTML=finalArt();gal.classList.remove('finishing')}
const stageName=n=>n===0?'未點亮':n===6?'全部點亮':n+' 顆星';
function previewStar(id){const entry=samples.find(e=>e.id===id);if(entry)$('message').textContent='這顆星的心情：'+MOODS[entry.mood].n+'（示例）'}
document.querySelector('.stages').innerHTML=Array.from({length:7},(_,n)=>`<button type="button" data-stage="${n}" aria-label="${stageName(n)}" aria-pressed="${n===0}">${n}</button>`).join('');
$('cards').innerHTML=Array.from({length:7},(_,n)=>`<button type="button" class="card" data-stage="${n}" aria-pressed="${n===0}" aria-label="預覽${stageName(n)}"><svg class="thumb" viewBox="0 0 110 86" aria-hidden="true">${n===6?finalArt(110,86):progressScene(n,110,86,12,n,.6)}</svg><span>${stageName(n)}</span></button>`).join('');
function render(n,finish=false,from=Number(n)){clearTimeout(finishTimer);finishTimer=null;gal.classList.remove('finishing');current=Math.max(0,Math.min(6,Number(n)));
if(current===6&&!freshId){
  if(finish&&!reduce){
    const id='round-final-'+(++revealId);
    gal.innerHTML=progressiveArt(5)+conSVG('Lyn',380,300,46,6,samples,{bg:70,sc:1.25,fig:false})+awakeMask(id,conProj('Lyn',380,300,46),conOrd('Lyn'),380,300,.3)+`<g class="final-reveal" mask="url(#fxm${id})">${finalArt()}</g>`;
    gal.classList.add('finishing');finishTimer=setTimeout(settleFinal,4200);
  }else{gal.innerHTML=finalArt()}
}else{gal.innerHTML=progressScene(current,380,300,46,freshId?Math.max(0,current-1):from,1.25,freshId?Math.max(0,current-1):current)}
gal.setAttribute('aria-label','天貓座，已點亮 '+current+' / 6 顆星');gal.querySelectorAll('.cstar[data-id]').forEach(el=>{el.onclick=()=>previewStar(el.dataset.id);el.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();previewStar(el.dataset.id)}}});if(finish||from!==current)gal.setCurrentTime?.(0);slider.value=current;slider.setAttribute('aria-valuetext',stageName(current)+'，'+current+' / 6 顆星');$('progressCount').textContent=current+' / 6 顆星';$('stateCount').textContent=current+' / 6';$('stateLabel').textContent=current===0?'尚未點亮':current===6?'全部點亮':'正在點亮';$('message').textContent=current===0?'寫下一則紀錄，點亮天貓座的第一顆星。':current===6?'六顆星都亮了，圓潤幼貓完整現身。':'已點亮 '+current+' / 6 顆星 · 再寫 '+(6-current)+' 則就完成';$('dots').innerHTML=sampleMoods.map((m,i)=>`<i class="${i<current?'on':''}" style="--c:var(${MOODS[m].c})"></i>`).join('');document.querySelectorAll('[data-stage]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.stage)===current)));nextButton.disabled=current===6||busy}
function stop(){if(current===6)settleFinal();token++;playing=false;play.textContent='▶ 播放點亮';play.setAttribute('aria-pressed','false');document.querySelectorAll('.comet,.trail,.spark,.lring').forEach(el=>el.remove());gal.classList.remove('arriving')}
async function advance(runToken){if(busy||current>=6)return;busy=true;const n=current+1;freshId=samples[n-1].id;render(n);nextButton.disabled=true;try{await launch(samples[n-1].mood);if(runToken===token){freshId=null;render(n,n===6,n-1);if(n===6&&!reduce){const r=gal.getBoundingClientRect();setTimeout(()=>{if(runToken===token)burst(r.left+r.width/2,r.top+r.height/2)},600)}}}finally{busy=false;freshId=null;nextButton.disabled=current===6;if(runToken!==token)document.querySelectorAll('.comet,.trail,.spark,.lring').forEach(el=>el.remove())}}
document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>{stop();freshId=null;render(b.dataset.stage)}));slider.addEventListener('input',()=>{stop();freshId=null;render(slider.value)});
nextButton.addEventListener('click',async()=>{stop();await advance(token)});
play.addEventListener('click',async()=>{if(playing){stop();return}if(busy)return;stop();playing=true;const t=token;render(0);play.textContent='❚❚ 暫停播放';play.setAttribute('aria-pressed','true');while(playing&&t===token&&current<6){await sleep(reduce?500:450);if(t!==token)break;await advance(t)}if(t===token){playing=false;play.textContent='▶ 播放點亮';play.setAttribute('aria-pressed','false')}});
$('complete').addEventListener('click',()=>{stop();freshId=null;render(6,true)});
document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-size]').forEach(o=>o.setAttribute('aria-pressed',String(o===b)));frame.classList.toggle('phone',b.dataset.size==='phone')}));

document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',event=>{reduce=event.matches;stop();render(current)});render(0);
</script>
</body>
</html>
