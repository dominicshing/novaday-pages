<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>Novaday · 天貓座逐區點亮預覽</title>
<link rel="stylesheet" href="../../../src/css/components/constellation-art.css">
<link rel="stylesheet" href="preview.css">
</head>
<body>
<header><a class="brand" href="../../../">✦ NOVADAY</a><span>效果預覽</span></header>
<main>
<div class="intro"><p class="eyebrow">一顆星，喚醒一部分星空</p><h1>讓天貓座逐步成形</h1><p>點亮主星，看看附近的身體如何浮現。<br>兩個方案同步播放，讓你比較區域交界的感覺。</p></div>
<section class="controls" aria-label="點亮進度控制">
<div class="progress-label"><label for="progress">已點亮主星</label><output id="count" for="progress">0 / 6</output></div>
<input id="progress" type="range" min="0" max="6" step="1" value="0">
<div class="steps" aria-label="選擇點亮顆數"></div>
<div class="actions"><button id="reset">重播起點</button><button id="play" aria-pressed="false">自動播放</button><button id="next" class="primary">點亮下一顆 ✦</button></div>
<p id="status" role="status">從第一顆星開始，喚醒腳邊的星塵。</p>
</section>
<div class="comparison">
<article class="option" data-mode="soft"><div class="card-heading"><div><span class="badge">方案 A</span><h2>柔和擴散</h2></div><span class="number">0 / 6 顆星</span></div><div class="cn-fig" id="soft"></div><p>光從主星散開，區域之間像星雲一樣柔和融合。</p><button class="choose" data-choice="A" aria-pressed="false">選擇 A · 柔和擴散</button></article>
<article class="option" data-mode="defined"><div class="card-heading"><div><span class="badge">方案 B</span><h2>分區浮現</h2></div><span class="number">0 / 6 顆星</span></div><div class="cn-fig" id="defined"></div><p>每顆主星喚醒一塊身體，完成進度更清楚。</p><button class="choose" data-choice="B" aria-pressed="false">選擇 B · 分區浮現</button></article>
</div>
<p id="choice" role="status">試試 2、3、4 顆星，最容易看出兩個方案的差別。</p>
<p class="note">此頁只供比較效果，不會改動你的日記或正式版設定。<br>選好後，回到對話告訴我 A 或 B，即可套用。</p>
</main>
<script src="../../../src/js/core/utils.js"></script>
<script src="../../../src/js/data/constellations.js"></script>
<script src="../../../src/js/data/zodiac-fortune.js"></script>
<script src="../../../src/js/ui/art/rank-badge.js"></script>
<script src="../../../src/js/logic/sky-projection.js"></script>
<script src="../../../src/js/ui/art/lynx-figure.js"></script>
<script src="preview.js"></script>
</body>
</html>
